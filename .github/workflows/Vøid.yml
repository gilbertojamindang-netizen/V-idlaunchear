name: VØIDLAUNCHEAR - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install ZIP Tools
      - name: Install Unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      # 5. Extract All ZIP Files
      - name: Extract Project ZIP Files
        run: |
          mkdir -p extracted

          find . -type f -name "*.zip" \
            -not -path "./extracted/*" \
            -print0 | while IFS= read -r -d '' file; do

              echo "Extracting: $file"

              folder="extracted/$(basename "$file" .zip)"
              mkdir -p "$folder"

              unzip -o "$file" -d "$folder"
          done

      # 6. Find Android Project
      - name: Locate Android Project
        run: |
          PROJECT_DIR=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.gradle/*" \
            -not -path "./.git/*" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      # 7. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 8. Build APK
      - name: Build VØIDLAUNCHEAR APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      # 9. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VØIDLAUNCHEAR-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
