name: Build VØIDLAUNCHEAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' \
            ! -path './.git/*' | head -n 1)"

          if [ -z "${ZIP_FILE}" ]; then
            echo "Walang ZIP file na nakita sa repository."
            echo "I-upload muna ang project ZIP sa repository, pagkatapos ay i-run ulit ang workflow."
            exit 1
          fi

          echo "Gagamitin ang ZIP: ${ZIP_FILE}"
          mkdir -p extracted
          unzip -q "${ZIP_FILE}" -d extracted

          SETTINGS_FILE="$(find extracted -type f \( \
            -name 'settings.gradle' -o -name 'settings.gradle.kts' \
          \) | head -n 1)"

          if [ -n "${SETTINGS_FILE}" ]; then
            PROJECT_DIR="$(dirname "${SETTINGS_FILE}")"
          else
            APP_GRADLE="$(find extracted -type f \( \
              -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \
            \) | head -n 1)"

            if [ -z "${APP_GRADLE}" ]; then
              echo "Hindi makita ang Android Gradle project sa loob ng ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$(dirname "${APP_GRADLE}")")"
          fi

          echo "Android project folder: ${PROJECT_DIR}"
          echo "PROJECT_DIR=${PROJECT_DIR}" >> "${GITHUB_ENV}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail

          COMPILE_SDK="$(
            grep -RhoE 'compileSdk(Version)?[[:space:]]*(=|[[:space:]])[[:space:]]*[0-9]+' \
              "${PROJECT_DIR}" \
              --include='build.gradle' --include='build.gradle.kts' \
              | grep -oE '[0-9]+' | tail -n 1 || true
          )"

          if [ -z "${COMPILE_SDK}" ]; then
            COMPILE_SDK="34"
            echo "Hindi ma-detect ang compileSdk; gagamit ng Android 34."
          fi

          echo "Installing Android platform ${COMPILE_SDK}"
          sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK}"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOIDLAUNCHEAR-debug-apk
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
